name: Stake Top 50

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: stake-top50
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Taipei monitoring day
        id: daycheck
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print('run=' + ('true' if datetime.now(ZoneInfo('Asia/Taipei')).isoweekday() in (5,6,7) else 'false'))
          PY

      - name: Install scraper dependencies
        if: steps.daycheck.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Fetch complete Stake Top 50
        if: steps.daycheck.outputs.run == 'true'
        shell: bash
        run: python stake_top50.py

      - name: Verify 50 rows
        if: steps.daycheck.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/stake_top50_latest.json',encoding='utf-8'))
          assert d.get('status') == 'ok' and d.get('count') == 50 and len(d.get('games',[])) == 50
          print('captured=', d['capturedAtTaipei'], 'source=', d['source'], 'count=50')
          for g in d['games']:
              print(g['rank'], g.get('name'), g.get('playerCount'), g.get('provider'))
          PY

      - name: Commit latest snapshot
        if: steps.daycheck.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "stake-top50-bot"
          git config user.email "stake-top50-bot@users.noreply.github.com"
          git add data/stake_top50_latest.json
          if git diff --cached --quiet; then
            echo "No snapshot change"
          else
            git commit -m "data: Stake Top 50 $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin HEAD:master
          fi

      - name: Upload failure diagnostics
        if: failure() && steps.daycheck.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stake-top50-failure-${{ github.run_id }}
          path: |
            stake_top50_failed.json
            stake_top50_debug.png
          if-no-files-found: ignore
